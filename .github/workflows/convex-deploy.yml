name: Deploy Convex

on:
  workflow_dispatch:
concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:accomplished-vole-302\|*) ;;
            *) echo "CONVEX_DEPLOY_KEY must target Careerpack main-v2 production" >&2; exit 1 ;;
          esac
          pnpm typecheck
          pnpm exec convex deploy --yes --typecheck disable
