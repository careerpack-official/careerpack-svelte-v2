name: Deploy Cloudflare frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: careerpack-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_CONVEX_URL: https://accomplished-vole-302.ap-southeast-2.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://accomplished-vole-302.ap-southeast-2.convex.site
      NEXT_PUBLIC_SITE_URL: https://careerpack.org
      APP_URL: https://careerpack.org
      NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_DOKU_DONATION_URL: ${{ vars.NEXT_PUBLIC_DOKU_DONATION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Verify active backend
        run: |
          curl --fail --silent --show-error --max-time 20 "$NEXT_PUBLIC_CONVEX_SITE_URL/api/health"
      - name: Build Worker
        run: pnpm build:cloudflare
      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:accomplished-vole-302\|*) ;;
            *) echo "CONVEX_DEPLOY_KEY must target Careerpack main-v2 production" >&2; exit 1 ;;
          esac
          pnpm exec convex deploy --yes --typecheck disable
          curl --fail --silent --show-error --max-time 20 "$NEXT_PUBLIC_CONVEX_SITE_URL/api/health"
      - name: Deploy Worker and populate cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8c0b86359883aaeeb6fd3ff73e54ec96
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm --filter careerpack-frontend exec opennextjs-cloudflare deploy
